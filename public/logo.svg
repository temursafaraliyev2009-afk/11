<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 38 332 212" width="100%" height="100%">
  <defs>
    <!-- Text linear gradient: to'q qora (deep black) to kulrang (slate gray) -->
    <linearGradient id="savatchiTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="30%" stop-color="#1E293B" />
      <stop offset="65%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Subtle soft shadow under columns -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <clipPath id="col-c-1">
      <rect x="55" y="140" width="26" height="100" rx="4" />
    </clipPath>
    <clipPath id="col-c-2">
      <rect x="99" y="165" width="26" height="75" rx="4" />
    </clipPath>
    <clipPath id="col-c-3">
      <rect x="143" y="190" width="26" height="50" rx="4" />
    </clipPath>
    <clipPath id="col-c-4">
      <rect x="187" y="174" width="26" height="66" rx="4" />
    </clipPath>
    <clipPath id="col-c-5">
      <rect x="231" y="152" width="26" height="88" rx="4" />
    </clipPath>
    <clipPath id="col-c-6">
      <rect x="275" y="130" width="26" height="110" rx="4" />
    </clipPath>
    <clipPath id="col-c-7">
      <rect x="319" y="108" width="26" height="132" rx="4" />
    </clipPath>
  </defs>

  <!-- Flat Horizontal Base Platform (Taglik) -->
  <rect x="36" y="240" width="328" height="6" rx="3" fill="#E2E8F0" />
  <rect x="36" y="244" width="328" height="2" rx="1" fill="#CBD5E1" />

  <!-- 7 Columns (2.5D flat vector style) -->
  <g filter="url(#softShadow)">
    <g clip-path="url(#col-c-1)">
      <rect x="55" y="140" width="26" height="100" fill="#F43F5E" />
      <rect x="74" y="140" width="7" height="100" fill="#BE123C" />
      <rect x="55" y="140" width="26" height="4.5" fill="#FDA4AF" />
      <line x1="74" y1="144.5" x2="74" y2="240" stroke="#BE123C" stroke-width="0.5" opacity="0.4" />
    </g>
    <g clip-path="url(#col-c-2)">
      <rect x="99" y="165" width="26" height="75" fill="#F43F5E" />
      <rect x="118" y="165" width="7" height="75" fill="#BE123C" />
      <rect x="99" y="165" width="26" height="4.5" fill="#FDA4AF" />
      <line x1="118" y1="169.5" x2="118" y2="240" stroke="#BE123C" stroke-width="0.5" opacity="0.4" />
    </g>
    <g clip-path="url(#col-c-3)">
      <rect x="143" y="190" width="26" height="50" fill="#F43F5E" />
      <rect x="162" y="190" width="7" height="50" fill="#BE123C" />
      <rect x="143" y="190" width="26" height="4.5" fill="#FDA4AF" />
      <line x1="162" y1="194.5" x2="162" y2="240" stroke="#BE123C" stroke-width="0.5" opacity="0.4" />
    </g>
    <g clip-path="url(#col-c-4)">
      <rect x="187" y="174" width="26" height="66" fill="#10B981" />
      <rect x="206" y="174" width="7" height="66" fill="#047857" />
      <rect x="187" y="174" width="26" height="4.5" fill="#6EE7B7" />
      <line x1="206" y1="178.5" x2="206" y2="240" stroke="#047857" stroke-width="0.5" opacity="0.4" />
    </g>
    <g clip-path="url(#col-c-5)">
      <rect x="231" y="152" width="26" height="88" fill="#10B981" />
      <rect x="250" y="152" width="7" height="88" fill="#047857" />
      <rect x="231" y="152" width="26" height="4.5" fill="#6EE7B7" />
      <line x1="250" y1="156.5" x2="250" y2="240" stroke="#047857" stroke-width="0.5" opacity="0.4" />
    </g>
    <g clip-path="url(#col-c-6)">
      <rect x="275" y="130" width="26" height="110" fill="#10B981" />
      <rect x="294" y="130" width="7" height="110" fill="#047857" />
      <rect x="275" y="130" width="26" height="4.5" fill="#6EE7B7" />
      <line x1="294" y1="134.5" x2="294" y2="240" stroke="#047857" stroke-width="0.5" opacity="0.4" />
    </g>
    <g clip-path="url(#col-c-7)">
      <rect x="319" y="108" width="26" height="132" fill="#10B981" />
      <rect x="338" y="108" width="7" height="132" fill="#047857" />
      <rect x="319" y="108" width="26" height="4.5" fill="#6EE7B7" />
      <line x1="338" y1="112.5" x2="338" y2="240" stroke="#047857" stroke-width="0.5" opacity="0.4" />
    </g>
  </g>

  <!-- SAVATCHI Text: Bold geometric sans-serif, uppercase, slanted parallel to green columns tops -->
  <g transform="translate(154, 152) rotate(-26.565)">
    <text x="0" y="0" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="23" 
          font-weight="900" 
          letter-spacing="3.5"
          fill="url(#savatchiTextGrad)"
          textLength="202"
          lengthAdjust="spacing"
          text-rendering="geometricPrecision">SAVATCHI</text>
  </g>
</svg>
